name: DAST with OWASP ZAP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t library/flask-app .

      - name: Run Flask app
        run: |
          docker run -d --name flask-app -p 5001:5001 library/flask-app
          for i in $(seq 1 15); do
            curl -s http://localhost:5001 && break || sleep 2
          done

      - name: Run OWASP ZAP full scan
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          mkdir -p "$WORKSPACE/zap-out" && chmod 777 "$WORKSPACE/zap-out"
          docker run --rm --network host \
            -v "$WORKSPACE/zap-out:/zap/wrk:rw" \
            zaproxy/zap-stable zap-full-scan.py \
            -t http://localhost:5001 \
            -r report.html -J report.json -I

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-out/

      - name: Publish report to GitHub Pages
        if: always()
        env:
          WORKSPACE: ${{ github.workspace }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git clone --depth 1 --branch gh-pages "$REMOTE" /tmp/pages; then
            cd /tmp/pages
          else
            mkdir /tmp/pages && cd /tmp/pages
            git init -b gh-pages
            git remote add origin "$REMOTE"
          fi
          mkdir -p zap-report-apres
          cp -r "$WORKSPACE"/zap-out/* zap-report-apres/
          git add -A
          git commit -m "Publish ZAP report" || echo "Nothing to commit"
          git push origin gh-pages
